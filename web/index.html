<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MackBot</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <nav id="sidebar">
        <div class="sidebar-header">
            <span class="logo">MackBot</span>
            <span class="version-badge">1.0</span>
        </div>

        <div class="char-section">
            <div class="char-avatar" id="charAvatar">?</div>
            <div class="char-info">
                <div class="char-name" id="charName">Deconnecte</div>
                <div class="char-server" id="charServer"></div>
            </div>
        </div>

        <div class="status-row">
            <span class="status-dot disconnected" id="statusDot"></span>
            <span class="status-text" id="statusText">Deconnecte</span>
        </div>

        <div class="sidebar-sep"></div>

        <div class="nav-items">
            <button class="nav-item active" data-tab="dashboard">
                <span class="nav-indicator"></span>
                <span>&#x25C9; Accueil</span>
            </button>
            <button class="nav-item" data-tab="harvest">
                <span class="nav-indicator"></span>
                <span>&#x26CF; Recolte</span>
            </button>
            <button class="nav-item disabled" data-tab="fight">
                <span class="nav-indicator"></span>
                <span>&#x2694; Chasse</span>
            </button>
            <button class="nav-item disabled" data-tab="market">
                <span class="nav-indicator"></span>
                <span>&#x1FA99; HDV</span>
            </button>
            <button class="nav-item" data-tab="map">
                <span class="nav-indicator"></span>
                <span>&#x2726; Carte</span>
            </button>
            <button class="nav-item disabled" data-tab="fm">
                <span class="nav-indicator"></span>
                <span>&#x1F527; FM</span>
            </button>
            <button class="nav-item" data-tab="sniffer">
                <span class="nav-indicator"></span>
                <span>&#x25C8; Sniffer</span>
            </button>
            <button class="nav-item" data-tab="settings">
                <span class="nav-indicator"></span>
                <span>&#x2699; Parametres</span>
            </button>
        </div>

        <div class="sidebar-footer">
            <span class="ws-status" id="wsStatus">&#x25CF; WS deconnecte</span>
        </div>
    </nav>

    <!-- Main content area -->
    <main id="main">
        <!-- Top header bar -->
        <header id="topbar">
            <div class="topbar-left">
                <h1 class="page-title" id="pageTitle">Accueil</h1>
            </div>
            <div class="topbar-right">
                <div class="topbar-char">
                    <span class="topbar-server" id="topbarServer"></span>
                    <span class="topbar-name" id="topbarName">Deconnecte</span>
                    <div class="topbar-avatar" id="topbarAvatar">?</div>
                </div>
            </div>
        </header>

        <!-- Tab content sections -->
        <div id="content">
            <section id="tab-dashboard" class="tab-content active">
                <div id="dashboard-content"></div>
                <div class="card" style="margin-top: 12px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <div class="card-title" style="margin: 0;">Logs</div>
                        <button class="btn btn-secondary" onclick="window.logsComponent.clear()" style="padding: 4px 12px; font-size: 10px;">Vider</button>
                    </div>
                    <div id="logs-container" class="log-area" style="height: 200px;"></div>
                </div>
            </section>

            <section id="tab-harvest" class="tab-content">
                <!-- Filled by harvest.js -->
            </section>

            <section id="tab-map" class="tab-content">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span style="font-size: 14px; color: var(--text-dim);" id="map-cell-info"></span>
                    </div>
                    <span class="badge badge-green" id="map-coords-badge"></span>
                </div>
                <div id="map-container" style="background: var(--bg-card); border-radius: var(--radius-lg); padding: 8px; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 450px;">
                    <canvas id="map-canvas"></canvas>
                </div>
                <div id="map-legend" style="display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap;"></div>
            </section>

            <section id="tab-sniffer" class="tab-content">
                <div class="placeholder-msg">Sniffer — Phase 6</div>
            </section>

            <section id="tab-settings" class="tab-content">
                <div class="placeholder-msg">Parametres — Phase 6</div>
            </section>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/ws.js"></script>
    <script src="js/store.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/logs.js"></script>
    <script src="js/map-renderer.js"></script>
    <script src="js/harvest.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
